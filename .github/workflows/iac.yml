name: IaC Policy Check

on:
  push:
    paths:
      - 'Lab07/**'
      - '.github/workflows/iac.yml'
  pull_request:
    paths:
      - 'Lab07/**'
      - '.github/workflows/iac.yml'

permissions:
  contents: read

jobs:
  iac-policy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: mock-access-key
      AWS_SECRET_ACCESS_KEY: mock-secret-key
      AWS_DEFAULT_REGION: us-east-1
    defaults:
      run:
        working-directory: Lab07
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12.3135.0
        with:
          directory: Lab07
          framework: terraform

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan.binary

      - name: Convert plan to JSON
        run: terraform show -json tfplan.binary > tfplan.json

      - name: Set up OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/v1.0.0/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/

      - name: Run OPA policy check
        run: |
          result=$(opa eval --data policy.rego --input tfplan.json "data.main.deny" --format raw)
          if [ "$result" != "[]" ]; then
            echo "Policy violation found:"
            echo "$result"
            exit 1
          fi