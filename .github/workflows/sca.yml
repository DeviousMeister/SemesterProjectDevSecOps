name: Build, Scan, and Sign

on: [push, pull_request]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-scan-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push image
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"

      - name: Resolve immutable image digest
        shell: bash
        run: |
          set -euo pipefail
          DIGEST="$(docker buildx imagetools inspect "$IMAGE:${{ github.sha }}" | awk '/^Digest:/ {print $2; exit}')"
          echo "IMAGE_REF=${IMAGE}@${DIGEST}" >> "$GITHUB_ENV"

      - name: Scan image with Trivy
        run: |
          curl -sfL -o install-trivy.sh https://raw.githubusercontent.com/aquasecurity/trivy/v0.75.0/contrib/install.sh
          echo "e00df553be558995b994758bc8995956554a16937f456dc6615b0cc411bfec7a  install-trivy.sh" | sha256sum -c -
          sh install-trivy.sh -b "$HOME/.local/bin" v0.75.0
          "$HOME/.local/bin/trivy" image "$IMAGE_REF"

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac

      - name: Sign the image by digest
        run: cosign sign --yes "$IMAGE_REF"

      - name: Verify image signature
        run: |
          cosign verify "$IMAGE_REF" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/sca.yml@.+$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
