name: Build, Scan, and Sign

on: [push, pull_request]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-scan-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Scan image with Trivy
        run: |
          curl -sfL -o install-trivy.sh https://raw.githubusercontent.com/aquasecurity/trivy/v0.75.0/contrib/install.sh
          echo "e00df553be558995b994758bc8995956554a16937f456dc6615b0cc411bfec7a  install-trivy.sh" | sha256sum -c -
          sh install-trivy.sh -b "$HOME/.local/bin" v0.75.0
          "$HOME/.local/bin/trivy" image ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac 

      - name: Sign the image
        run: cosign sign --yes ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Verify image signature
        run: |
          cosign verify ghcr.io/${{ github.repository }}:${{ github.sha }} \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
